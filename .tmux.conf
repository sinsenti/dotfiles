# Stow this file as ~/.tmux.conf so tmux finds it without -f.

# Primary prefix: Ctrl+Space
set -g prefix C-Space
bind-key C-Space send-prefix

# Secondary prefix: Backtick (`)
set -g prefix2 `
bind-key ` send-prefix -2

# For Pi and other applications that use modified keys.
set -g extended-keys on

set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
# set-option -g default-path ~
# set -gq allow-passthrough on # for image showing in nvim
set -g allow-passthrough on

# Leave the shell unset so tmux uses the user's login shell on any machine.

set -g pane-active-border-style 'fg=cyan,bg=default'
# set -g pane-border-lines single
# set -g pane-border-indicators arrows
# set -g pane-border-status off
# set -g pane-border-style fg=colour242
# set -g pane-active-border-style fg=cyan
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set-option -wg automatic-rename off

# SessionX's zoxide mode can use an absolute path as the initial window name.
# Shorten path-based names to the working directory's final component.
set-hook -g after-new-session 'if-shell -F "#{m:*/*,#{window_name}}" { rename-window "#{b:pane_current_path}" }'

set -g default-terminal "${TERM}"

unbind l
unbind "'"
bind '"' choose-session
bind e send-keys "y"\; send-keys "Enter"

bind c new-window -c "#{pane_current_path}"

# Prefix + i opens the workmux dashboard in a popup.
unbind-key i
bind-key i display-popup -d /home/user/git/project/a1labs -w 90% -h 80% -E 'workmux dashboard'

# Remove the old global Ctrl-G scratchpad binding.
unbind-key -n C-g

# Prefix + ; toggles a temporary Neovim scratch window in /tmp.
unbind-key \;
bind-key \; if-shell -F '#{==:#{window_name},scratch}' 'kill-window' 'new-window -n scratch -c /tmp "~/.config/scripts/scratchpad.sh"'

bind C new-session
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind q detach
set -g status-position top
set -g mouse on

bind-key -T copy-mode-vi v send-keys -X begin-selection
# Prefix + u scrolls up; prefix + o opens the URL picker.
bind u copy-mode \; send-keys -X scroll-up
bind r command-prompt "rename-window %%"
bind R source-file '~/.tmux.conf'\; display-message "Reloaded!"
bind S choose-session
bind ^A last-window
bind w choose-window
bind h previous-window
bind l next-window

bind | split-window
bind s split-window -h -c "#{pane_current_path}"
bind - split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind = split-window -v -c "#{pane_current_path}"
bind | split-window -h
bind z resize-pane -Z

bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix _ resize-pane -D 7
bind -r -T prefix + resize-pane -U 7
bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind k kill-pane
bind K kill-window
bind x swap-pane -D
bind m set status

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
# Add these lines for Ubuntu Wayland clipboard integration:
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @thumbs-upcase-command 'echo -n {} | wl-copy && tmux paste-buffer'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-bind 'o'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind-configuration-path 'ctrl-c'
# set -g @sessionx-bind-kill-session 'ctrl-x'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
# set -g floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
# set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-bind "'"
set -g @sessionx-window-mode 'on'
# Keep resurrect saves in one stable location across tmux/plugin moves.
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
# set -g @sessionx-custom-paths '~/dotfiles'
# set -g @sessionx-x-path '~/dotfiles'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

set -g @catppuccin_date_time_text "%H:%M"


# --- Transparency Settings ---
# set -g status-bg default
# set -g status-style bg=default
# set -g @catppuccin_status_background "default"
# set -g @catppuccin_window_default_background "default"
# -----------------------------

# Keep TPM and its plugins in the conventional ~/.tmux/plugins directory.
# Setting this before TPM starts also lets the first-run installer find the
# correct path.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# Bootstrap TPM and all configured plugins on a fresh machine. Later plugin
# additions can still be installed with the TPM prefix + I binding.
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' \
  '' \
  'run-shell "mkdir -p ~/.tmux/plugins && git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins"'

# TPM must be initialized last, after all plugin options have been declared.
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' \
  'run-shell ~/.tmux/plugins/tpm/tpm' \
  'display-message "TPM is unavailable; install git and retry tmux."'
