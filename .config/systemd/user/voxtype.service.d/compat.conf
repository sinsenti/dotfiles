[Service]
# Keep the legacy ydotool adapter private to Voxtype.
Environment="PATH=%h/.config/voxtype/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
# Keep the UI in Voxtype's service cgroup so stop/restart also cleans it up.
# The shell returns immediately; the optional UI cannot delay daemon startup.
ExecStartPost=/bin/sh -c '/usr/bin/python3 "%h/.config/voxtype/status_window.py" &'
# Optional local voice commands share Voxtype's lifetime, with no idle capture.
ExecStartPost=/bin/sh -c '"$${XDG_DATA_HOME:-%h/.local/share}/voxtype/stop-commands/.venv/bin/python" "%h/.config/voxtype/stop_listener.py" &'
