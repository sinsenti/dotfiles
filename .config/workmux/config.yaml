nerdfont: true

# theme: default

main_branch: dev
agent: pi
mode: window
worktree_dir: .claude/worktrees

panes:
  - command: pi
    focus: true

# Keep the dashboard open when jumping to a worktree.
dashboard:
  close_on_jump: false
  preview_size: 70

# Keep status icons in the workmux dashboard, but do not inject them into tmux window names.
status_format: false

status_icons:
  working: "🤖"
  waiting: "💬"
  done: "✅"
