# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
# include ./kitty-themes/00-Default.conf

# font_family FantasqueSansM Nerd Font Mono Bold
font_family JetBrainsMono Nerd Font
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto

startup_session fullscreen

background_opacity 0.8
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_blink_interval 0
cursor_trail 0
# cursor_trail_start_threshold 0
# cursor_trail_decay 0.1 0.4
mouse_hide_wait -1.0


repaint_delay 2
input_delay 0
sync_to_monitor no

# On Wayland
wayland_enable_ime no

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell yes

window_padding_width 0
resize_in_steps yes
placement_strategy center

selection_foreground none
selection_background none
allow_remote_control yes
foreground #dddddd
background #1e1e2e
# default
# background #000000
cursor #dddddd

# tab_bar_style      none
hide_window_decorations yes
